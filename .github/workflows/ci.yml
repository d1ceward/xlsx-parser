name: CI
on:
  push:
    branches:
      - master
      - develop
  pull_request:
    types:
      - opened
      - synchronize
jobs:
  lints:
    name: Lints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set crystal version environement variable
        run: echo "CRYSTAL_VERSION=$(grep '^crystal' .tool-versions | awk '{print $2}')" >> $GITHUB_ENV
      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1.9.2
        with:
          crystal: ${{ env.CRYSTAL_VERSION }}
      - name: Crystal shard cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lib
          key: ${{ runner.os }}-shards-${{ hashFiles('**/shard.lock') }}
      - name: Install dependencies
        run: shards install
      - name: Run ameba
        run: crystal lib/ameba/bin/ameba.cr
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set crystal version environement variable
        run: echo "CRYSTAL_VERSION=$(grep '^crystal' .tool-versions | awk '{print $2}')" >> $GITHUB_ENV
      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1.9.2
        with:
          crystal: ${{ env.CRYSTAL_VERSION }}
      - name: Crystal shard cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lib
          key: ${{ runner.os }}-${{ matrix.crystal }}-shards-${{ hashFiles('**/shard.lock') }}
      - name: Install dependencies
        run: shards install --production
      - name: Run tests
        run: crystal spec
